app: ask
version: 1
user: "<nama user>"
owner: "<nama owner>"
data_sources: [Document, DocumentChunk]
permission_rule: internal_corpus_only
views:
  - name: ask
    entity: DocumentChunk
    fields: [text_content, section_ref, source_path]
    filters: [collection, stage]
    sort: []
actions: []
notifications: []
memory_scope: private
deprecation_condition: no questions in 90 consecutive days
failsafe: answers without a supporting chunk render "No source found."
