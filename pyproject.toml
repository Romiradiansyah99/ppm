[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppm"
version = "3.0.0"
description = "PPM - Hermes Agent office knowledge platform with public multi-user memory"
requires-python = ">=3.11"

[project.scripts]
ppm = "ppm.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requires a live Postgres database",
    "model: requires live Ollama models",
]
