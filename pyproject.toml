[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppm"
version = "0.1.0"
description = "PPM (Pocket Project Manager) - office truth layer and agent apps. Phase 0: rate lookup."
requires-python = ">=3.11"

[project.scripts]
ppm = "ppm.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requires a live Postgres with the pgvector extension",
]
